stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: maven-cache
  paths:
    - .m2/repository/

api-tests:
  stage: test

  image: maven:3.9-eclipse-temurin-21

  script:
    - mvn clean test

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/allure-results/
      - target/surefire-reports/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml